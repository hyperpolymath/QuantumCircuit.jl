# SPDX-License-Identifier: MPL-2.0
name: CI
permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Julia ${{ matrix.julia-version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1.10', '1.11']
        os: [ubuntu-latest]
        include:
          - julia-version: '1.11'
            os: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v2
      # The julia-professional-registry (JPR) moves on every push; pin the
      # checkout to a reviewed commit so CI cannot go red from a registry
      # change alone. Bump JPR_SHA deliberately, in its own PR.
      - name: Fetch julia-professional-registry at a pinned commit
        env:
          JPR_SHA: 449703faea446669778aaeb8dfc3547bd578cfeb
        run: |
          git clone --quiet https://github.com/hyperpolymath/julia-professional-registry.git "$RUNNER_TEMP/jpr"
          git -C "$RUNNER_TEMP/jpr" checkout --quiet "$JPR_SHA"
      - name: Install, build, test
        env:
          JPR_PATH: ${{ runner.temp }}/jpr
        run: julia --project=. -e 'using Pkg; Pkg.Registry.add("General"); Pkg.Registry.add(Pkg.RegistrySpec(path=ENV["JPR_PATH"])); Pkg.instantiate(); Pkg.build(); Pkg.test()'
